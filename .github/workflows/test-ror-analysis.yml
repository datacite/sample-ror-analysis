name: Test ROR Analysis

on:
  workflow_dispatch:  # manual run only

jobs:
  test-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: bundle install

      - name: Generate ROR analysis
        run: |
          mkdir -p test_output
          bundle exec ruby scripts/generate_analysis.rb \
            --output test_output/funder_to_ror.json.gz

      - name: Validate JSON
        run: |
          gunzip -c test_output/funder_to_ror.json.gz | jq '.' > /dev/null

      - name: Upload test output
        uses: actions/upload-artifact@v3
        with:
          name: ror-json-gz
          path: test_output/funder_to_ror.json.gz
