name: Export and Upload ROR JSONs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # monthly, at midnight on the 1st

jobs:
  export-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: bundle install

      - name: Download ROR source data
        run: |
          bundle exec ruby download_ror_data.rb

      - name: Build ROR data files
        run: |
          bundle exec ruby build_ror_data.rb

      - name: List generated files for debug
        run: ls -l *.json.gz || true

      - name: Validate funder_to_ror.json.gz
        run: |
          gunzip -c funder_to_ror.json.gz | jq '.' > /dev/null

      - name: Validate ror_hierarchy.json.gz
        run: |
          gunzip -c ror_hierarchy.json.gz | jq '.' > /dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload JSON files to S3
        run: |
          aws s3 cp funder_to_ror.json.gz s3://ror-analysis.datacite.org/funder_to_ror.json.gz
          aws s3 cp ror_hierarchy.json.gz s3://ror-analysis.datacite.org/ror_hierarchy.json.gz

      - name: Upload JSON output as artifact (optional backup)
        uses: actions/upload-artifact@v3
        with:
          name: ror-jsons
          path: "*.json.gz"